name: Run Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        jupyterlab-version: ['4.0.13', '4.6.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'

      - name: Setup pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-
            pip-

      - name: Install JupyterLab ${{ matrix.jupyterlab-version }}
        run: python -m pip install "jupyterlab==${{ matrix.jupyterlab-version }}"
      - name: Install the extension
        run: python -m pip install .[dev]
      - name: Verify JupyterLab version
        run: python -c "import jupyterlab; assert jupyterlab.__version__ == '${{ matrix.jupyterlab-version }}', jupyterlab.__version__"
      - name: Test with pytest
        run: pytest -v
