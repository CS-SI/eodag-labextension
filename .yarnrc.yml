compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: true
nodeLinker: node-modules

packageExtensions:
  '@jupyterlab/services@*':
    dependencies:
      react: '*'
  'style-loader@*':
    peerDependenciesMeta:
      webpack:
        optional: true
  '@types/react-datepicker@*':
    dependencies:
      react: '*'
      react-dom: '*'
