[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-jupyter-builder>=0.5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "eodag_labextension"
dynamic = ["version", "description", "authors", "urls"]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = ["Jupyter", "JupyterLab", "JupyterLab4"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
]
dependencies = [
    "jupyterlab~=4.0",
    "tornado>=6.4.1,<7.0.0",
    "eodag[notebook]>=4.0.0a4",
    "orjson",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
    "pytest",
    "shapely",
]

[tool.hatch.version]
source = "regex"
path = "package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "binder", "node_modules"]

[tool.hatch.build.targets.wheel.shared-data]
"eodag_labextension/labextension" = "share/jupyter/labextensions/eodag-labextension"
"install.json" = "share/jupyter/labextensions/eodag-labextension/install.json"
"jupyter-config/jupyter_notebook_config.d/eodag_labextension.json" = "etc/jupyter/jupyter_notebook_config.d/eodag_labextension.json"
"jupyter-config/jupyter_server_config.d/eodag_labextension.json" = "etc/jupyter/jupyter_server_config.d/eodag_labextension.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["eodag_labextension/labextension/package.json"]
skip-if-exists = ["eodag_labextension/labextension/package.json"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "build"
npm = ["jlpm"]
source_dir = "src"
build_dir = "eodag_labextension/labextension"

[tool.black]
line-length = 120

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
known_third_party = ["eodag", "jupyter_server", "notebook", "tornado"]

[tool.semantic_release.branches.main]
match = "(master|develop|new-release)"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''build: bump version.+''',
]
mode = "update"
insertion_flag = "# Release history"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGES.md"
output_format = "md"
